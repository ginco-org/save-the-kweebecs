# CI for the Save the Kweebecs plugin.
#
# `build` compiles the plugin and runs the manifest generation + jar — no
# Hytale account needed. If integration tests are added later (e.g. via
# hytest), mirror the integration job from hytale-minigame-framework/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (compile + plugin jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile plugin and build jar
        run: ./gradlew compileKotlin jar --no-build-cache
